name: Publish Nuget

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing: OIDC token exchanged for a NuGet API key
      contents: read
    steps:
      - name: Checkout 
        uses: actions/checkout@v4
  
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x
  
      - name: Restore dependencies
        run: dotnet restore src/XTerm.NET.slnx

      - name: Build
        run: dotnet build src/XTerm.NET.slnx -c Release --no-restore 
  
      - name: dotnet pack 
        run: |
          dotnet pack --no-build src/XTerm.NET.slnx -c Release -o packages --include-symbols --property WarningLevel=0

      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: thermous

      - name: Publish NuGet and symbols
        id: nuget-push
        uses: edumserrano/nuget-push@v1
        with:
          api-key: '${{ steps.nuget-login.outputs.NUGET_API_KEY }}' 
          working-directory: 'packages'
          fail-if-exists: false
        
