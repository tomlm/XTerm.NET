name: BuildAndRunTests

on:
  workflow_dispatch:
    inputs:
      chars:
        description: >-
          PerfCompare: work budget per corpus per run, divided by that corpus's known relative cost
          so each is measured for about the same length of time. More is slower and quieter.
        default: "100000000"
      runs:
        description: "PerfCompare: runs of each side."
        default: "3"
  push:
    branches:
      - main
    paths:
    - src/**
  pull_request:
    branches: [ "main" ]
    paths:
    - src/**

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout XTerm.NET.slnx
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src/XTerm.NET.slnx

    - name: Build
      run: dotnet build --no-restore src/XTerm.NET.slnx --property WarningLevel=0

    - name: Test
      run: dotnet test --no-build --verbosity normal src/XTerm.NET.slnx

  # Measures this branch against the commit it forked from, on one machine, alternating.
  #
  # Allocation is gated exactly and time is gated against the noise the job observes in itself --
  # see src/XTerm.NET.Bench/ComparePr.cs for why those two are held to different standards.
  #
  # A job here rather than a workflow of its own, because `needs` is the only way to say "after
  # the build passed" that keeps the pull_request context. workflow_run would run this in the
  # default branch's context with no github.event.pull_request at all, and its
  # workflow_run.pull_requests[] is empty for FORK pull requests -- which is most of them -- so
  # the base sha and PR number this job depends on would both be missing exactly when needed.
  perf:
    needs: build
    # Nothing to compare a push against: base.sha is empty outside a pull request, and the
    # HEAD~1 fallback below would measure main against its own previous commit on every merge.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    # Only this job needs to write; the build job keeps the repository default.
    permissions:
      contents: read
      pull-requests: write

    env:
      CHARS: ${{ inputs.chars || '100000000' }}
      RUNS: ${{ inputs.runs || '3' }}
      OUT: src/XTerm.NET.Bench/bin/Release/net10.0

      # ---- THE PERF GATES. Both live here, in the file that runs them. ----
      #
      # PER-PR: this change against what it branches from. Each corpus fails at
      # max(TIME_FLOOR, 3 x its own measured noise), so a corpus quiet enough to measure
      # tightly is held to exactly this number.
      TIME_FLOOR: "0.04"
      #
      # CUMULATIVE: this change against a PINNED REFERENCE, because a per-PR gate bounds no
      # trajectory. Four percent allowed five times compounds to 21.7%, and every one of those
      # PRs passes its own gate on the way. This is the budget for ALL drift since the
      # reference, so the PR that spends the last of it is the one that has to find the time
      # back -- or the reference moves deliberately, in a change that says why.
      # Empty means THE LATEST RELEASE TAG, resolved at run time, so this never goes stale and
      # nobody has to remember to move it: cutting a release moves the reference with it, and the
      # budget below then covers drift since that release. Set it to a ref to pin deliberately.
      BASELINE_REF: ""
      BASELINE_FLOOR: "0.05"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        # Tags too: the cumulative gate below resolves the latest release tag, and a checkout
        # without them silently finds nothing and skips itself.
        fetch-tags: true

    - uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    # The harness comes from THIS branch and is used against both libraries, so the two sides are
    # measured by identical code. That is only safe because the ci mode touches nothing but
    # Terminal, TerminalOptions and Write(string) -- anything newer would fail against the base.
    - name: Build the harness and this branch's library
      run: |
        dotnet build src/XTerm.NET.Bench -c Release --property WarningLevel=0
        mkdir -p /tmp/libs
        cp "$OUT/XTerm.NET.dll" /tmp/libs/head.dll

    - name: Build the baseline library
      id: baseline
      run: |
        # Absent or unfetchable, the cumulative gate is skipped rather than failing the run --
        # a fork or a shallow clone should not look like a regression.
        # The nearest tag reachable from here, unless one was pinned above. --abbrev=0 gives the
        # closest by commit distance rather than the lexically largest, which is what "the release
        # this branched from" means once release numbering stops sorting the way you expect.
        REF="$BASELINE_REF"
        if [ -z "$REF" ]; then
          REF="$(git describe --tags --abbrev=0 2>/dev/null || true)"
        fi
        echo "baseline ref: ${REF:-<none found>}"
        echo "ref=$REF" >> "$GITHUB_OUTPUT"

        if [ -n "$REF" ] && git rev-parse --verify "$REF^{commit}" >/dev/null 2>&1; then
          git worktree add /tmp/baseline "$REF"
          dotnet build /tmp/baseline/src/XTerm.NET -c Release --property WarningLevel=0 \
            -p:CopyLocalLockFileAssemblies=true
          cp /tmp/baseline/src/XTerm.NET/bin/Release/net10.0/XTerm.NET.dll /tmp/libs/baseline.dll
          cp -n /tmp/baseline/src/XTerm.NET/bin/Release/net10.0/*.dll "$OUT/" || true
          echo "available=true" >> "$GITHUB_OUTPUT"
        else
          echo "no baseline ref resolved; cumulative gate skipped"
          echo "available=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the base library
      run: |
        BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
        echo "base commit: $BASE"
        git worktree add /tmp/base "$BASE"
        # CopyLocalLockFileAssemblies, because a plain library build does not put package
        # assemblies in its bin — and the base may depend on packages the head no longer
        # carries. The swap below only replaces XTerm.NET.dll, so the base's companions are
        # staged no-clobber: head's versions win where both sides have one, and the base's
        # extras merely sit unloaded while head runs.
        dotnet build /tmp/base/src/XTerm.NET -c Release --property WarningLevel=0           -p:CopyLocalLockFileAssemblies=true
        cp /tmp/base/src/XTerm.NET/bin/Release/net10.0/XTerm.NET.dll /tmp/libs/base.dll
        cp -n /tmp/base/src/XTerm.NET/bin/Release/net10.0/*.dll "$OUT/" || true

    # Alternating, so a runner that gets slower or faster part way through does so to both sides
    # rather than to one. Run through `dotnet <dll>` rather than `dotnet run`, which would rebuild
    # and put the branch's own library straight back over the one being measured.
    - name: Measure
      run: |
        # The baseline joins the alternation rather than being measured separately: comparing
        # against a number recorded on some other runner would measure the runner, not the code.
        SIDES="base head"
        [ "${{ steps.baseline.outputs.available }}" = "true" ] && SIDES="baseline base head"

        for r in $(seq 1 "$RUNS"); do
          for side in $SIDES; do
            cp "/tmp/libs/$side.dll" "$OUT/XTerm.NET.dll"
            dotnet "$OUT/XTerm.NET.Bench.dll" ci \
              --chars "$CHARS" --warm-chars $((CHARS / 4)) \
              --out "/tmp/$side-$r.json"
          done
        done

    - name: Compare
      id: compare
      env:
        # THE PERF GATE. Each corpus fails at max(this, 3 x its own measured noise), so this is
        # the floor -- a corpus quiet enough to measure tightly is held to exactly this number.
        # It lives here, in the file that runs the gate, rather than as a default buried in the
        # bench's argument parsing, so changing it does not mean going to find it first.
        TIME_FLOOR: "0.04"
      run: |
        cp /tmp/libs/head.dll "$OUT/XTerm.NET.dll"
        set +e
        dotnet "$OUT/XTerm.NET.Bench.dll" compare \
          --base $(ls /tmp/base-*.json) \
          --head $(ls /tmp/head-*.json) \
          --time-floor "$TIME_FLOOR" \
          --out /tmp/report.md
        echo "status=$?" >> "$GITHUB_OUTPUT"
        set -e
        cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Compare against the pinned baseline
      id: compare-baseline
      if: steps.baseline.outputs.available == 'true'
      run: |
        set +e
        dotnet "$OUT/XTerm.NET.Bench.dll" compare \
          --base $(ls /tmp/baseline-*.json) \
          --head $(ls /tmp/head-*.json) \
          --time-floor "$BASELINE_FLOOR" \
          --out /tmp/baseline-report.md
        echo "status=$?" >> "$GITHUB_OUTPUT"
        set -e
        {
          echo ""
          echo "## Cumulative, against \`${{ steps.baseline.outputs.ref }}\`"
          echo ""
          echo "Everything merged since the reference, measured together. A per-PR gate bounds"
          echo "each change and nothing about the trajectory: 4% allowed five times compounds to"
          echo "21.7%, with every one of those PRs green on its way past."
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"
        cat /tmp/baseline-report.md >> "$GITHUB_STEP_SUMMARY"

    # Best effort. A pull request from a fork gets a read-only token, so this cannot post -- the job
    # summary above is the copy that always exists.
    - name: Comment on the pull request
      if: github.event_name == 'pull_request'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" --edit-last --body-file /tmp/report.md \
          || gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/report.md

    - name: Fail on a regression
      if: steps.compare.outputs.status != '0' || (steps.compare-baseline.outputs.status != '' && steps.compare-baseline.outputs.status != '0')
      run: |
        if [ "${{ steps.compare.outputs.status }}" != "0" ]; then
          echo "::error::This change regressed against its base. See the job summary."
        fi
        if [ "${{ steps.compare-baseline.outputs.status }}" != "" ] \
           && [ "${{ steps.compare-baseline.outputs.status }}" != "0" ]; then
          echo "::error::Cumulative drift since ${{ steps.baseline.outputs.ref }} is over budget. Either find the time back, or move the reference deliberately in a change that says why."
        fi
        exit 1
