name: Publish Nuget Prerelease

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing: OIDC token exchanged for a NuGet API key
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.0.x

      - name: Determine prerelease version
        id: versioning
        run: |
          # The package project, named rather than searched for. This was
          # `find src -name "*.csproj" -not -name "*Test*" | head -1`, which returns whatever the
          # directory walk reaches first -- Cat150.Fork today. That project carries no <Version>,
          # so the lookup fell through to a hardcoded 1.0.0 and every prerelease went out as
          # 1.0.0-rc001. The package id came from the same wrong file, so the query for existing
          # release candidates asked about a package that does not exist and the counter never
          # advanced either. This repo publishes one package and every other step already names the
          # solution outright, so there was never anything to discover.
          CSPROJ=src/XTerm.NET/XTerm.NET.csproj

          BASE_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' "$CSPROJ" | sed 's/-.*//' || true)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(grep -oPm1 '(?<=<VersionPrefix>)[^<]+' "$CSPROJ" | sed 's/-.*//' || true)
          fi

          # Fail rather than guess. A version pushed to nuget.org cannot be replaced or reused, so
          # publishing under an invented number is the one outcome worse than a red build.
          if [ -z "$BASE_VERSION" ]; then
            echo "::error::No <Version> or <VersionPrefix> found in $CSPROJ -- refusing to invent one."
            exit 1
          fi

          PKG_ID=$(grep -oPm1 '(?<=<PackageId>)[^<]+' "$CSPROJ" || true)
          if [ -z "$PKG_ID" ]; then
            PKG_ID=$(basename "$CSPROJ" .csproj)
          fi
          PKG_LOWER=$(echo "$PKG_ID" | tr '[:upper:]' '[:lower:]')
          VERSIONS=$(curl -sS "https://api.nuget.org/v3-flatcontainer/${PKG_LOWER}/index.json" | jq -r '.versions[]' 2>/dev/null || echo "")
          ESCAPED_VERSION=$(echo "$BASE_VERSION" | sed 's/\./\\./g')
          MAX_RC=$(echo "$VERSIONS" | grep -oP "^${ESCAPED_VERSION}-rc\K[0-9]+" | sort -n | tail -1)
          if [ -z "$MAX_RC" ]; then
            NEXT_RC=1
          else
            NEXT_RC=$((MAX_RC + 1))
          fi
          PRERELEASE_VERSION="${BASE_VERSION}-rc$(printf '%03d' $NEXT_RC)"
          echo "version=$PRERELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "Prerelease version: $PRERELEASE_VERSION"

      - name: Restore dependencies
        run: dotnet restore src/XTerm.NET.slnx

      - name: Build
        run: dotnet build src/XTerm.NET.slnx -c Release --no-restore

      - name: dotnet pack
        run: |
          dotnet pack src/XTerm.NET.slnx -c Release -o packages --include-symbols --property WarningLevel=0 /p:Version=${{ steps.versioning.outputs.version }}

      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: thermous

      - name: Publish NuGet and symbols
        id: nuget-push
        uses: edumserrano/nuget-push@v1
        with:
          api-key: '${{ steps.nuget-login.outputs.NUGET_API_KEY }}'
          working-directory: 'packages'
          fail-if-exists: false

